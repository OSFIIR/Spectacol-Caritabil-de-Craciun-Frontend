ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    RewriteEngine On
    # Only actual navigation routes fall back to the SPA.
    # Missing assets and /api/* must remain 404 responses.
    RewriteRule ^(artists|sponsors|team|donate)/?$ /index.html [END]
</Directory>
